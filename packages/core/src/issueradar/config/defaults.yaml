# Default settings. Your own firstpr.yaml overrides any value here.
#
# GitHub numbers come from GitHub's docs, checked 2026-10-01. Sources for each
# are in docs/github-api-notes.md. Code reads them from here, never from
# constants (ADR 0005).

github:
  api_url: https://api.github.com
  graphql_url: https://api.github.com/graphql
  user_agent: firstpr (+https://github.com/MuskanScripts/IssueRadar)
  request_timeout_seconds: 30

  rest:
    authenticated_per_hour: 5000
    unauthenticated_per_hour: 60
    actions_token_per_hour: 1000
    per_page: 100

  graphql:
    points_per_hour: 5000
    max_page_size: 100        # first/last must be 1..100
    max_nodes_per_call: 500000
    server_timeout_seconds: 10
    batch_size: 20            # issues per batched query; keeps calls well under the timeout

  search:
    requests_per_minute: 30
    code_requests_per_minute: 10
    unauthenticated_requests_per_minute: 10
    max_results_per_query: 1000
    max_query_chars: 256
    max_boolean_operators: 5
    max_repositories_per_query: 4000
    per_page: 100

  secondary:
    max_concurrent_requests: 100       # shared by REST and GraphQL
    rest_points_per_minute: 900
    graphql_points_per_minute: 2000
    cpu_seconds_per_minute: 90
    graphql_cpu_seconds_per_minute: 60

  concurrency:
    max_in_flight: 1                   # serial by default, as GitHub recommends

  retry:
    max_retries: 4
    min_secondary_wait_seconds: 60     # "wait for at least one minute"
    backoff_factor: 2.0
    max_wait_seconds: 3600
    server_error_wait_seconds: 2       # first wait after a 5xx, then backoff_factor

  budget:
    safety_margin: 0.10                # stop planning new work at 10% remaining

storage:
  # Leave empty to use a SQLite file in your user data folder.
  # The FIRSTPR_DB_URL environment variable overrides this.
  url:

sync:
  max_pages_per_list: 10   # 10 pages x 100 = up to 1,000 open issues or PRs per repo
  scan_open_pull_requests: true

enrich:
  # Finalists per repo: open issues with no assignee and no closing PR, most
  # recently updated first. Only these get their comments and timeline fetched.
  max_issues_per_repo: 30
  fetch_timeline: true
  linked_pr_search: true      # one search per repo: is:issue is:open linked:pr
  repo_health: true

availability:
  stale_claim_days: 14
  maintainer_associations: [OWNER, MEMBER, COLLABORATOR]
  # Lowercase phrases. A comment matches if it contains the phrase.
  claim_patterns:
    - "can i work on this"
    - "can i work on it"
    - "can i take this"
    - "can i take it"
    - "could i work on this"
    - "may i work on this"
    - "i'll take this"
    - "i will take this"
    - "i'd like to work on this"
    - "i would like to work on this"
    - "i want to work on this"
    - "i'm working on this"
    - "i am working on this"
    - "working on this"
    - "picking this up"
    - "assign me"
    - "assign this to me"
    - "/assign"
    - "/take"
  release_patterns:           # the claimer giving it back
    - "no longer working on"
    - "not working on this anymore"
    - "can't work on this"
    - "cannot work on this"
    - "unassign me"
    - "feel free to take it"
  invitation_patterns:        # maintainers inviting work: a positive signal, not a claim
    - "feel free to take this"
    - "feel free to pick this up"
    - "feel free to work on this"
    - "contributions welcome"
    - "a pr is welcome"
    - "pr welcome"
    - "prs welcome"
    - "happy to accept a pr"
    - "happy to review a pr"
  not_ready_labels:           # added to each repo's own list
    - "needs triage"
    - "needs confirmation"
    - "needs maintainer action"
    - "needs-triage"
    - "blocked"
    - "on hold"
    - "wontfix"
    - "won't fix"
    - "duplicate"
    - "invalid"
    - "question"
  non_english_ascii_ratio: 0.7    # below this share of ASCII letters: not English
  non_english_min_words: 25       # with at least this many words...
  non_english_stopword_ratio: 0.04  # ...and fewer English stopwords than this share

difficulty:
  beginner_max: 33        # 0-33 Beginner
  intermediate_max: 66    # 34-66 Intermediate, 67-100 Pro
  base_score: 45          # starting point when no label says anything
  tier_anchor:            # starting point when a label maps to a tier
    beginner: 15
    intermediate: 50
    pro: 80
  label_tiers:            # default label map; per-repo rules override it
    "good first issue": beginner
    "good-first-issue": beginner
    "first-timers-only": beginner
    "beginner": beginner
    "easy": beginner
    "starter": beginner
    "help wanted": intermediate
    "help-wanted": intermediate
    "medium": intermediate
    "hard": pro
    "complex": pro
  adjustments:            # points added to the score when the signal is present
    docs_or_typo: -15
    tests_only: -10
    code_or_repro: -5
    names_a_file: -5
    short_body: -5
    long_body: 10
    many_comments: 10
    per_linked_issue: 5
    max_linked_issues: 3
    discussion_first: 20
    performance_or_concurrency: 15
    security: 10
  short_body_chars: 400
  long_body_chars: 3000
  many_comments: 10
  time_buckets:           # upper score bound for each estimate
    under_an_hour: 20
    half_a_day: 45
    a_weekend: 70         # above this: a week or more
  keywords:
    docs_or_typo: [typo, spelling, "broken link", "dead link", docs, documentation, readme, docstring, grammar]
    tests_only: ["add test", "add a test", "missing test", "test coverage", "unit test", "write tests"]
    discussion_first: ["needs proposal", "needs a proposal", "discuss first", "design doc", "rfc", "needs discussion", "proposal first"]
    performance_or_concurrency: [performance, slow, latency, memory leak, "race condition", deadlock, concurrency, concurrent, thread-safe, "thread safe", async, parallel]
    security: [security, vulnerability, cve, xss, injection, "auth bypass"]
    repro: ["steps to reproduce", "to reproduce", "repro", "minimal example", "traceback", "stack trace"]

health:
  cache_hours: 24
  weights:                # must add up to 100
    first_response: 30
    outside_merge_rate: 30
    recent_commit: 20
    pr_backlog: 10
    contributor_docs: 10
  response_days_good: 2      # median first maintainer reply at or under this: full points
  response_days_bad: 30      # at or over this: zero, linear in between
  commit_days_good: 7
  commit_days_bad: 180
  backlog_good: 10           # open PRs at or under this: full points
  backlog_bad: 100
  min_samples: 3             # fewer data points than this: metric unknown, scored 0.5
  closed_prs_sample: 100     # recent closed PRs used for the merge rate

stack:
  extensions:
    ".py": python
    ".ts": typescript
    ".tsx": typescript
    ".js": javascript
    ".jsx": javascript
    ".java": java
    ".kt": kotlin
    ".go": go
    ".rs": rust
    ".rb": ruby
    ".cs": csharp
    ".cpp": cpp
    ".c": c
    ".php": php
    ".swift": swift
  frameworks:              # framework -> dependency names that reveal it
    react: [react, react-dom]
    vue: [vue]
    angular: ["@angular/core"]
    nextjs: [next]
    svelte: [svelte]
    django: [django]
    fastapi: [fastapi]
    flask: [flask]
    pydantic: [pydantic]
    pytest: [pytest]
    spring: [spring-boot, spring-core, spring-boot-starter, org.springframework.boot, org.springframework]
    junit: [junit, junit-jupiter, org.junit.jupiter]
    express: [express]
    pytorch: [torch]
    tensorflow: [tensorflow]
  domains:                 # domain -> GitHub topics that reveal it
    agents-and-mcp: [mcp, model-context-protocol, agents, ai-agents, agent, llm, llms]
    web: [web, frontend, react, vue, javascript, typescript, css]
    devops: [devops, kubernetes, docker, ci, infrastructure, terraform]
    data: [data, etl, pandas, analytics, database, sql]
    ml: [machine-learning, deep-learning, ml, pytorch, tensorflow, ai]
    fintech: [fintech, payments, finance, banking]
  manifests: [package.json, pyproject.toml, requirements.txt, pom.xml, build.gradle, build.gradle.kts, go.mod, Cargo.toml]

ranking:
  weights:                # must add up to 1.0
    tier_fit: 0.35
    repo_health: 0.25
    stack_fit: 0.20
    freshness: 0.10
    low_competition: 0.10
  freshness_half_life_days: 30
  competition_comments: 10   # this many comments or more: no low-competition points

pull_requests:
  stale_days: 7             # no activity from anyone else for this long: stale, nudge drafted
  track_days: 90            # track your PRs updated within this many days
  unreviewed_warning_at: 3  # coach warns when this many of your open PRs await a first review

digest:
  top_n: 5
  new_since_hours: 24       # "New since yesterday" looks back this far
  quiet_repo_days: 60       # watchlist alert when a repo has no push for this long
  output_folder: digests    # where the Markdown and RSS files go (relative to where you run it)
  channels:
    markdown:
      enabled: true
    rss:
      enabled: true
      max_items: 30
      link: ""              # optional: where the feed's items should link to
    email:
      enabled: false
      smtp_host: ""
      smtp_port: 587
      starttls: true
      username: ""
      sender: ""
      recipient: ""
      password_env: FIRSTPR_SMTP_PASSWORD
    telegram:
      enabled: false
      chat_id: ""
      token_env: FIRSTPR_TELEGRAM_TOKEN
    discord:
      enabled: false
      webhook_env: FIRSTPR_DISCORD_WEBHOOK
    slack:
      enabled: false
      webhook_env: FIRSTPR_SLACK_WEBHOOK
