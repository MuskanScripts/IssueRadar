<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A clickable preview of the FirstPR platform with sample data: daily pick, workspace flow, PR tracker, activity calendar and more.">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<title>FirstPR Preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + one working column; the next contribution is the one loud card, everything else stays quiet. */
:root {
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #eaeef2;
  --ink: #14202b;
  --ink-2: #51606e;
  --line: #d9e0e7;
  --accent: #0b6b63;
  --accent-ink: #ffffff;
  --accent-soft: #d9efec;
  --warm: #b4570b;
  --warm-soft: #fbe9d6;
  --good: #1f7a3d;
  --good-soft: #dcf1e2;
  --bad: #b3322b;
  --bad-soft: #f8dfdd;
  --mid: #8a6a00;
  --mid-soft: #f6ecc4;
  --cal-0: #e3e8ed; --cal-1: #b5e3c1; --cal-2: #6cc287; --cal-3: #2f9a56; --cal-4: #146b36;
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1419; --surface: #151d24; --surface-2: #1c2630; --ink: #e6edf3; --ink-2: #93a3b2;
    --line: #26323d; --accent: #3fc1b3; --accent-ink: #06201d; --accent-soft: #123631;
    --warm: #f0a35e; --warm-soft: #3a2713; --good: #5fd48a; --good-soft: #143222;
    --bad: #f08a83; --bad-soft: #3a1b19; --mid: #e3c25a; --mid-soft: #342b0d; --cal-0: #1f2a34; --cal-1: #134a2b; --cal-2: #1f7a41; --cal-3: #36b062; --cal-4: #6fe39a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1419; --surface: #151d24; --surface-2: #1c2630; --ink: #e6edf3; --ink-2: #93a3b2;
  --line: #26323d; --accent: #3fc1b3; --accent-ink: #06201d; --accent-soft: #123631;
  --warm: #f0a35e; --warm-soft: #3a2713; --good: #5fd48a; --good-soft: #143222;
  --bad: #f08a83; --bad-soft: #3a1b19; --mid: #e3c25a; --mid-soft: #342b0d; --cal-0: #1f2a34; --cal-1: #134a2b; --cal-2: #1f7a41; --cal-3: #36b062; --cal-4: #6fe39a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14.5px; line-height: 1.5; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.num { font-variant-numeric: tabular-nums; }

.shell { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { padding: 20px 14px; border-right: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; align-self: start; height: 100vh; }
.logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 700; font-size: 19px; padding: 0 8px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 6px; color: var(--ink-2); font-weight: 500; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.nav svg { width: 17px; height: 17px; flex: none; }
.rail-foot { margin-top: auto; font-size: 12px; color: var(--ink-2); padding: 0 8px; }
.me { all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 8px; border-top: 1px solid var(--line); margin-top: 10px; border-radius: 6px; width: 100%; }
.me:hover, .me[aria-current="page"] { background: var(--surface-2); }
.me:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.me .dot-warn { width: 9px; height: 9px; border-radius: 50%; background: var(--warm); margin-left: auto; }
.reconnect { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--warm-soft); border: 1px solid color-mix(in srgb, var(--warm) 45%, transparent); border-left: 4px solid var(--warm); padding: 12px 14px; border-radius: 8px; margin-bottom: 20px; }
.reconnect .txt { flex: 1 1 320px; min-width: 0; }
.reconnect b { color: var(--warm); }
.reconnect .sub { margin-top: 2px; }
.prof-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.avatar.xl { width: 72px; height: 72px; font-size: 30px; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 13.5px; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; }
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.status.ok { color: var(--good); } .status.bad { color: var(--warm); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-family: var(--f-display); }

.main { padding: 26px clamp(16px, 3vw, 40px) 60px; max-width: 1060px; width: 100%; }
.banner { background: var(--warm-soft); color: var(--warm); border: 1px solid color-mix(in srgb, var(--warm) 30%, transparent); padding: 8px 12px; border-radius: 6px; font-size: 12.5px; margin-bottom: 22px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.top h1 { font-size: clamp(24px, 3.4vw, 32px); }
.sub { color: var(--ink-2); margin-top: 4px; }
.stats { display: flex; gap: 22px; flex-wrap: wrap; }
.stat b { display: block; font-family: var(--f-display); font-size: 22px; line-height: 1.1; }
.stat span { font-size: 12px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.06em; }
.streak b { color: var(--warm); }

.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px; min-width: 0; }
.panel h2 { font-size: 16px; margin-bottom: 12px; }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; }

.next { border: 2px solid var(--accent); background: var(--surface); border-radius: 10px; padding: 22px; display: grid; gap: 14px; }
.next h2 { font-size: clamp(20px, 2.6vw, 26px); }
.next .head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.timer { font-family: var(--f-mono); font-size: 13px; background: var(--accent-soft); color: var(--accent); padding: 3px 9px; border-radius: 99px; }
.meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.chip.b { background: var(--good-soft); color: var(--good); }
.chip.i { background: var(--mid-soft); color: var(--mid); }
.chip.a { background: var(--bad-soft); color: var(--bad); }
.chip.free { background: var(--good-soft); color: var(--good); }
.chip.likely { background: var(--mid-soft); color: var(--mid); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 6px 16px; }
.checks li { display: flex; gap: 8px; align-items: flex-start; }
.checks svg { width: 16px; height: 16px; color: var(--good); flex: none; margin-top: 3px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; font-weight: 600; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.fit { --p: 80; width: 52px; height: 52px; border-radius: 50%; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.fit i { font-style: normal; width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; font-family: var(--f-mono); }

.list { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 4px; border-top: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-bottom: 0; width: 100%; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 600; }
.item .r { color: var(--ink-2); font-size: 12.5px; font-family: var(--f-mono); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.filters input, .filters select, .field input, .field textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; min-width: 0; }
.filters input { flex: 1 1 200px; }

.bar { height: 7px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.skill { display: grid; grid-template-columns: 78px 1fr 28px; gap: 10px; align-items: center; margin: 9px 0; font-size: 13px; }

.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.steps li { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
.steps li.done { color: var(--ink); }
.steps li .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
.steps li.done .dot { background: var(--good); border-color: var(--good); color: #fff; }
.steps li.now .dot { border-color: var(--accent); border-top-color: transparent; animation: spin 0.8s linear infinite; }
.steps svg { width: 11px; height: 11px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .steps li.now .dot { animation: none; } }

.hint { border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 9px 12px; border-radius: 0 6px 6px 0; margin-top: 8px; }
.hint b { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
code, .code { font-family: var(--f-mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }

.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { font-size: 12.5px; font-weight: 600; }
.field textarea { min-height: 120px; resize: vertical; font-family: var(--f-mono); font-size: 12.5px; }

.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; }
.badge.locked { opacity: 0.5; }
.badge b { font-family: var(--f-display); }
.badge span { font-size: 12.5px; color: var(--ink-2); }

table { width: 100%; border-collapse: collapse; }
.tw { overflow-x: auto; }
th, td { text-align: left; padding: 9px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); border-top: 0; }
tr.me-row td { background: var(--accent-soft); font-weight: 600; }

.back { all: unset; cursor: pointer; color: var(--ink-2); font-weight: 500; margin-bottom: 14px; display: inline-block; }
.back:hover { color: var(--accent); }
.toast { position: fixed; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 500; z-index: 10; max-width: calc(100vw - 32px); }

.cal-wrap { overflow-x: auto; padding-bottom: 4px; }
.cal { display: grid; grid-template-rows: repeat(7, var(--c)); grid-auto-flow: column; grid-auto-columns: var(--c); gap: 3px; --c: 11px; width: max-content; }
.cal.big { --c: 15px; gap: 4px; }
.cal i { display: block; width: var(--c); height: var(--c); border-radius: 3px; background: var(--cal-0); position: relative; }
.cal i.l1 { background: var(--cal-1); } .cal i.l2 { background: var(--cal-2); } .cal i.l3 { background: var(--cal-3); } .cal i.l4 { background: var(--cal-4); }
.cal i.l4::after { content: ""; position: absolute; inset: 30%; border-radius: 50%; background: var(--surface); }
.cal i.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal i.pad { visibility: hidden; }
.legend { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-2); margin-top: 8px; flex-wrap: wrap; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; background: var(--cal-0); }
.legend i.l1 { background: var(--cal-1); } .legend i.l2 { background: var(--cal-2); } .legend i.l3 { background: var(--cal-3); } .legend i.l4 { background: var(--cal-4); }
.months { display: flex; font-size: 11px; color: var(--ink-2); margin-bottom: 4px; width: max-content; }
.today-note { font-size: 13px; margin-top: 10px; }

.hero { display: grid; gap: 18px; padding: clamp(18px, 4vw, 40px) 0 10px; }
.hero h1 { font-size: clamp(32px, 5.6vw, 58px); line-height: 1.02; letter-spacing: -0.025em; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .lead { font-size: 17px; color: var(--ink-2); max-width: 56ch; }
.counters { display: flex; gap: clamp(18px, 4vw, 44px); flex-wrap: wrap; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.counters b { display: block; font-family: var(--f-display); font-size: clamp(24px, 3.4vw, 34px); line-height: 1.05; }
.counters span { font-size: 12.5px; color: var(--ink-2); }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--good); font-weight: 600; }
.live::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--good); }
.btn.big { padding: 12px 20px; font-size: 15.5px; }
.section { margin-top: 38px; display: grid; gap: 14px; }
.section > h2 { font-size: clamp(21px, 2.8vw, 28px); }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.pcard { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.pcard .t { font-weight: 600; }
.pcard .why { font-size: 12.5px; color: var(--good); }
.pcard.locked { position: relative; overflow: hidden; }
.pcard.locked > .blur { filter: blur(5px); opacity: 0.6; pointer-events: none; display: grid; gap: 8px; }
.pcard.locked > .over { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 14px; background: color-mix(in srgb, var(--surface) 55%, transparent); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.tile { border-top: 2px solid var(--accent); padding-top: 12px; display: grid; gap: 4px; }
.tile b { font-family: var(--f-display); font-size: 16.5px; }
.tile span { color: var(--ink-2); font-size: 13.5px; }
details { border-top: 1px solid var(--line); padding: 12px 0; }
details summary { cursor: pointer; font-weight: 600; }
details p { margin-top: 6px; color: var(--ink-2); max-width: 65ch; }
.final { background: var(--accent); color: var(--accent-ink); border-radius: 10px; padding: clamp(20px, 4vw, 36px); display: grid; gap: 12px; justify-items: start; margin-top: 38px; }
.final h2 { font-size: clamp(22px, 3vw, 30px); }
.final .btn { background: var(--accent-ink); color: var(--accent); border-color: var(--accent-ink); }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-weight: 600; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }
.rank { font-family: var(--f-mono); color: var(--ink-2); width: 2ch; display: inline-block; }
.sheet { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 45%, transparent); display: grid; place-items: center; padding: 16px; z-index: 20; }
[hidden] { display: none !important; }
.sheet-card { background: var(--surface); border-radius: 10px; padding: 24px; max-width: 420px; width: 100%; display: grid; gap: 12px; border: 1px solid var(--line); }
.sheet-card h2 { font-size: 22px; }
.sheet-card ul { margin: 0; padding-left: 18px; color: var(--ink-2); display: grid; gap: 4px; }
.rail .btn.primary { margin: 0 4px; white-space: nowrap; font-size: 13px; padding: 8px 10px; }

.soon { display: inline-block; font-style: normal; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 7px; border-radius: 99px; border: 1px dashed var(--ink-2); color: var(--ink-2); white-space: nowrap; vertical-align: middle; }
.nav button .soon { margin-left: auto; font-size: 9.5px; padding: 0 5px; }
.soonbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; border: 1px dashed var(--line); background: var(--surface-2); border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
.soonbar .txt { flex: 1 1 260px; min-width: 0; display: grid; gap: 2px; }
.soonmini { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); padding: 8px 0 0; }
.soonmini b { color: var(--ink); font-weight: 600; }
.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.paths div { border: 1px solid var(--line); border-radius: 8px; padding: 12px; display: grid; gap: 4px; background: var(--surface); }

.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar .upd { font-size: 12.5px; color: var(--ink-2); margin-right: auto; }
.chip.new { background: var(--accent-soft); color: var(--accent); }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.panel-head h2 { margin: 0; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: -2px; margin-right: 6px; }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; align-items: center; padding: 10px 12px; gap: 12px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .nav { flex-direction: row; }
  .nav button { white-space: nowrap; }
  .rail-foot, .me-text, .me .dot-warn, .logo span { display: none !important; }
  .me { border-top: 0; margin-top: 0; width: auto; padding: 4px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .main { padding-top: 18px; }
}
</style>
<style>html, body { height: 100%; } body { margin: 0; }</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true"><circle cx="14" cy="14" r="12" stroke="var(--accent)" stroke-width="2"/><circle cx="14" cy="14" r="6.5" stroke="var(--accent)" stroke-width="2" opacity="0.55"/><path d="M14 14L22 7" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"/><circle cx="14" cy="14" r="2" fill="var(--accent)"/></svg>
      <span>FirstPR</span>
    </div>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <button class="btn primary" id="rail-signin" data-signin>Sign in with GitHub</button>
    <button class="me" id="rail-me" data-go="profile" aria-label="Your profile" hidden><div class="avatar">M</div><div class="me-text"><div style="font-weight:600">Muskan</div><div class="label" style="text-transform:none;letter-spacing:0">Intermediate</div></div><span class="dot-warn" id="me-warn" hidden title="GitHub needs reconnecting"></span></button>
    <div class="rail-foot">Preview with sample data</div>

const DAY = 864e5;
const isoDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

const ACT = (() => {

    const d = new Date(TODAY.getTime() - back * DAY);
    let mins = 0, actions = 0, merged = false;
    if (back <= 8) { mins = 20 + Math.floor(rnd() * 70); actions = rnd() > 0.5 ? 1 : 0; }
    else if (back === 9) { mins = 4; }
    else { const r = rnd(); if (r > 0.42) mins = 15 + Math.floor(rnd() * 100); else if (r > 0.3) mins = Math.floor(rnd() * 14); if (rnd() > 0.85) actions = 1; }
    if (back === 6 || back === 41 || back === 77 || back === 130 || back === 190 || back === 240 || back === 300 || back === 333) merged = true;
    rows.push({ day: isoDay(d), mins, actions, merged });

  rows.push({ day: isoDay(TODAY), mins: 11, actions: 0, merged: false, today: true });

  <section class="panel" style="margin-bottom:18px"><h2>Activity this year</h2><div data-cal="53" data-big="1">${calendarHtml(53, true)}</div></section>

    <div class="col">
      <section class="panel"><h2>Merged pull requests</h2><div class="list">${merged.map(rowPr).join('')}
        <div class="item" style="cursor:default"><div><div class="t">Fix typo in the CLI help</div><div class="r" style="font-family:var(--f-body)">pallets/click. Merged 3 weeks ago, +50 XP</div></div><span class="chip b">Merged</span></div>
        <div class="item" style="cursor:default"><div><div class="t">Add test for empty proxy list</div><div class="r" style="font-family:var(--f-body)">encode/httpx. Merged 5 weeks ago, +100 XP</div></div><span class="chip b">Merged</span></div></div></section>
      <section class="panel"><h2>Skills</h2>${skills.map(([n, p, l]) => `<div class="skill"><span>${n}</span><div class="bar" role="img" aria-label="${n} ${l} of 5"><i style="width:${p}%"></i></div><b class="num">${l}/5</b></div>`).join('')}</section>
    </div>
    <div class="col">
      <section class="panel"><h2>Connected GitHub account</h2>
        <dl class="kv">
          <dt>Account</dt><dd class="mono">@MuskanScripts</dd>
          <dt>Status</dt><dd>${state.ghOk ? '<span class="status ok">Connected</span>' : '<span class="status bad">Reconnect needed</span>'}</dd>
          <dt>Last sync</dt><dd>${state.ghOk ? '4 minutes ago' : 'Oct 3, 21:40'}</dd>
          <dt>Access</dt><dd>Read your profile and PRs. Fork and workspace after your first Start working.</dd>
        </dl>
        <div class="row" style="margin-top:14px">${state.ghOk ? '<button class="btn small" data-break>Simulate lost access</button>' : '<button class="btn primary small" data-reconnect>Reconnect GitHub</button>'}</div>
        <p class="sub" style="font-size:12px;margin-top:8px">${state.ghOk ? 'Demo only: shows what happens when GitHub access expires or is revoked.' : 'Your XP, streak and calendar are kept while you reconnect.'}</p>
      </section>
      <section class="panel"><h2>Public profile</h2>
        <p class="sub" style="margin-bottom:10px">Anyone with the link sees your merged PRs, badges and calendar.</p>
        <p class="mono" style="font-size:12.5px;margin-bottom:12px">firstpr.dev/u/MuskanScripts</p>
        <div class="row"><button class="btn small" data-copy>Copy link</button><button class="btn small" data-public>${state.publicProfile ? 'Make private' : 'Make public'}</button><span class="chip ${state.publicProfile ? 'b' : ''}">${state.publicProfile ? 'Public' : 'Private'}</span></div>
      </section>
      <section>${soonBar('teams')}</section>
      <section class="panel"><h2>Account</h2>
        <div class="row"><button class="btn small" data-go="progress">Progress details</button><button class="btn small" data-signout>Sign out</button></div>
      </section>
    </div>
  </div>`;
}

function render() {
  renderNav();
  const v = state.view;
  $('#main').innerHTML = '<div class="banner">This is a preview with sample data. Nothing here talks to GitHub.</div>' + reconnectBanner() +
    ({ intro: viewIntro, trending: viewTrending, home: viewHome, explore: viewExplore, issue: viewIssue, practice: viewPractice, prs: viewPrs, progress: viewProgress, board: viewBoard, profile: viewProfile, paths: viewPaths }[v])();
}

function advance() {
  clearTimeout(tick);
  if (state.ws >= 1 && state.ws <= 4) {
    tick = setTimeout(() => { state.ws += 1; if (state.view === 'issue') { $('#work').innerHTML = '<h2>Workspace</h2>' + workHtml(issue(state.issueId)); } advance(); }, 900);
  }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.hasAttribute('data-signin')) return openSheet(null);
  if (t.hasAttribute('data-close')) return closeSheet();
  if (t.hasAttribute('data-gh') && state.reconnecting) { state.ghOk = true; state.reconnecting = false; closeSheet(); toast('GitHub reconnected. Syncing your PRs now'); render(); return; }
  if (t.hasAttribute('data-gh')) { state.signedIn = true; closeSheet(); toast('Signed in as Muskan'); const a = state.after; state.after = null; return a ? (state.picked = Number(a) === feed.pickId, go('issue', Number(a))) : go('home'); }
  if (t.hasAttribute('data-refresh')) { doRefresh(); return; }
  if (t.hasAttribute('data-shuffle')) { doShuffle(); render(); toast('Shuffled'); return; }
  if (t.hasAttribute('data-bestfit')) { feed.order = [...ISSUES].sort((a, b) => b.fit - a.fit).map((i) => i.id); feed.shuffled = false; render(); return; }
  if (t.hasAttribute('data-shuffle-home')) { feed.alsoOffset += 3; render(); return; }
  if (t.hasAttribute('data-another')) { const n = nextPick(); render(); toast(`New pick reserved for 48 hours: ${n.repo} #${n.num}`); return; }
  if (t.dataset.want) { state.want[t.dataset.want] = true; toast(`Thanks. We will tell you when ${SOON[t.dataset.want][0]} is ready.`); render(); return; }
  if (t.hasAttribute('data-break')) { state.ghOk = false; state.hideBanner = false; toast('GitHub access lost (demo)'); render(); return; }
  if (t.hasAttribute('data-reconnect')) { openSheet(null, true); return; }
  if (t.hasAttribute('data-later')) { state.hideBanner = true; render(); return; }
  if (t.hasAttribute('data-public')) { state.publicProfile = !state.publicProfile; toast(state.publicProfile ? 'Profile is public' : 'Profile is private'); render(); return; }
  if (t.hasAttribute('data-copy')) { const txt = 'https://firstpr.dev/u/MuskanScripts'; try { navigator.clipboard.writeText(txt).then(() => toast('Link copied'), () => toast(txt)); } catch (_) { toast(txt); } return; }
  if (t.hasAttribute('data-signout')) { state.signedIn = false; toast('Signed out'); go('intro'); return; }
  if (t.dataset.tab) { state.trendTab = t.dataset.tab; render(); return; }
  if (t.dataset.try) { return state.signedIn ? go('issue', Number(t.dataset.try)) : openSheet(t.dataset.try); }
  if (t.dataset.go) return go(t.dataset.go);
  if (t.dataset.issue) { if (t.hasAttribute('data-pick')) state.picked = true; return go('issue', Number(t.dataset.issue)); }
  if (t.hasAttribute('data-hint')) { state.hints += 1; $('#mentor').innerHTML = mentorHead() + mentorHtml(issue(state.issueId)); return; }
  if (t.hasAttribute('data-start')) { state.ws = 1; $('#work').innerHTML = '<h2>Workspace</h2>' + workHtml(issue(state.issueId)); advance(); return; }
  if (t.hasAttribute('data-open')) return toast('In the real app this opens your Codespace in a new tab.');
  if (t.hasAttribute('data-finish')) { state.ws = 6; $('#work').innerHTML = '<h2>Workspace</h2>' + workHtml(issue(state.issueId)); return; }
  if (t.hasAttribute('data-pr')) {
    const i = issue(state.issueId), title = ($('#pt') || {}).value || i.title;
    state.prs.unshift({ repo: i.repo, title, status: 'review', note: 'Just opened, waiting for a first review' });
    state.ws = 7; $('#work').innerHTML = '<h2>Workspace</h2>' + workHtml(i); toast('Pull request created'); return;
  }
  if (t.dataset.practice) { state.done[t.dataset.practice] = true; state.xp += 10; todayRow().actions += 1; toast('+10 XP. Today counts as a green day'); render(); return; }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { state.filter.q = e.target.value; $('#list').innerHTML = listHtml(); }
});
document.addEventListener('change', (e) => {
  if (e.target.id === 'pick-lang') { state.pickLang = e.target.value; $('#pick-results').innerHTML = pickResults(); }
  if (e.target.id === 'pick-lvl') { state.pickLevel = e.target.value; $('#pick-results').innerHTML = pickResults(); }
  if (e.target.id === 'lvl') { state.filter.level = e.target.value; $('#list').innerHTML = listHtml(); }
  if (e.target.id === 'lng') { state.filter.lang = e.target.value; $('#list').innerHTML = listHtml(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') closeSheet(); });
setInterval(updateRefreshUi, 1000);
setInterval(() => { timerSec = timerSec > 0 ? timerSec - 1 : 0; const el = $('#timer'); if (el) el.textContent = fmtTimer(timerSec); }, 1000);
render();
</script>
</body>
</html>
