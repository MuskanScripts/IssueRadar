# The FirstPR platform for local development: Postgres, Redis, the API, the worker,
# the Next.js web app and a proxy in front that puts them on one address.
# This is separate from the root docker-compose.yml, which runs the self-hosted CLI dashboard.
#
#   docker compose -f infra/compose/compose.yaml up --build
#
# Then open http://localhost:8080 (the API is at http://localhost:8080/api/v1/health)

name: firstpr-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firstpr
      POSTGRES_PASSWORD: firstpr   # local development only
      POSTGRES_DB: firstpr
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-catalogue.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firstpr -d firstpr"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      FIRSTPR_DATABASE_URL: postgresql+psycopg://firstpr:firstpr@postgres:5432/firstpr
      FIRSTPR_REDIS_URL: redis://redis:6379/0
      FIRSTPR_PUBLIC_URL: http://localhost:8080
      FIRSTPR_COOKIE_SECURE: "false"   # plain http on localhost only
    # GitHub App keys and the token key go in infra/compose/.env (see .env.example).
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      FIRSTPR_DATABASE_URL: postgresql+psycopg://firstpr:firstpr@postgres:5432/firstpr
      FIRSTPR_CATALOGUE_DATABASE_URL: postgresql+psycopg://firstpr:firstpr@postgres:5432/firstpr_catalogue
      FIRSTPR_REDIS_URL: redis://redis:6379/0
      FIRSTPR_PUBLIC_URL: http://localhost:8080   # for links in emails
    # The GitHub App's ID and private key, and the same keys as the API.
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started   # the API applies the platform migrations

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api

  proxy:
    image: caddy:2-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  postgres:
