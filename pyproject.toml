[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# The distribution name and the CLI command below must match
# src/issueradar/brand.json (see docs/adr/0002-brand-in-one-place.md).
name = "firstpr"
version = "0.0.1"
description = "Find open-source issues you can actually work on, then track the pull requests you open."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muskan" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "httpx>=0.27,<1",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "graphql-core>=3.2,<4",
  "platformdirs>=4.2,<5",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# The MCP server (firstpr mcp). Kept optional: most users don't need its dependencies.
mcp = ["mcp>=2.3,<3"]
dev = [
  "mcp>=2.3,<3",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
  "respx>=0.21,<1",
  "pytest-asyncio>=0.24,<2",
]

[project.scripts]
firstpr = "issueradar.cli:app"

[project.urls]
Homepage = "https://github.com/MuskanScripts/IssueRadar"
Issues = "https://github.com/MuskanScripts/IssueRadar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/issueradar"]
# The built dashboard is copied here by scripts/bundle_web.py before a release
# build. It is git-ignored, so it has to be listed as an artifact.
artifacts = ["src/issueradar/web/**"]

[tool.hatch.build.targets.sdist]
include = ["src/issueradar", "tests", "README.md", "LICENSE", "CHANGELOG.md"]
artifacts = ["src/issueradar/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
# Exception names like NotFound and QuotaExhausted read better without "Error".
ignore = ["N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["issueradar"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
