[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
# The distribution name and the CLI command below must match
# src/issueradar/brand.json (see docs/adr/0002-brand-in-one-place.md).
name = "firstpr"
version = "0.0.1"
description = "Find open-source issues you can actually work on, then track the pull requests you open."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muskan" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6.0",
]

[project.scripts]
firstpr = "issueradar.cli:app"

[project.urls]
Homepage = "https://github.com/MuskanScripts/IssueRadar"
Issues = "https://github.com/MuskanScripts/IssueRadar/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/issueradar"]

[tool.hatch.build.targets.sdist]
include = ["src/issueradar", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PTH", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["issueradar"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
