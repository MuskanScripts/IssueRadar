name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test
        run: pytest
      - name: CLI smoke test
        run: |
          firstpr --version
          firstpr doctor
          firstpr demo

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test and accessibility checks (demo mode)
        run: npm run e2e

  package:
    name: Build Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Check bundled data is in the wheel
        run: |
          python -m pip install dist/*.whl
          cd /tmp && firstpr doctor

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: firstpr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start it and check the dashboard and API answer
        shell: pwsh
        run: |
          docker run -d --name firstpr -p 8765:8765 firstpr:ci firstpr serve --host 0.0.0.0 --port 8765 --demo
          $ok = $false
          foreach ($i in 1..30) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8765/api/health; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { docker logs firstpr; throw "The container never answered /api/health" }
          if ($health.status -ne 'ok') { throw "Unexpected health: $($health | ConvertTo-Json)" }
          $page = Invoke-WebRequest http://127.0.0.1:8765/
          if ($page.Content -notmatch '<div id="root">') { throw "The dashboard was not served" }
          docker run --rm firstpr:ci firstpr doctor

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
